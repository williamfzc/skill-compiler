# Release: static binaries + checksums + the one-key installer.
#
# Triggered by pushing a v* tag. Cross-compiles the same single static
# binary README promises (CGO_ENABLED=0), packs one tar.gz per platform,
# emits checksums.txt, and attaches everything -- plus scripts/install.sh
# under the stable asset name install.sh -- to a GitHub Release. That
# attachment is what makes releases/latest/download/install.sh a permanent
# one-key install URL.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${platform%/*} arch=${platform#*/}
            dir=dist/skillc_${os}_${arch}
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags='-s -w' -o "$dir/skillc" ./cmd/skillc
            cp LICENSE README.md "$dir/"
            tar -czf "dist/skillc_${os}_${arch}.tar.gz" -C "$dir" .
          done
          (cd dist && sha256sum skillc_*.tar.gz > checksums.txt)
          cp scripts/install.sh dist/install.sh

      - name: publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/install.sh
          generate_release_notes: true
